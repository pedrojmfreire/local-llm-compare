<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-08 Markdown LLM Test Harness</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    .toolbar {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    label {
      font-weight: 600;
    }

    select,
    button {
      font: inherit;
      min-height: 34px;
    }

    select {
      min-width: min(420px, 100%);
    }

    button {
      cursor: pointer;
      padding: 4px 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      flex-basis: 100%;
      min-height: 1.4em;
    }

    #status.error {
      color: #b00020;
    }

    #main {
      border: 1px solid ButtonBorder;
      min-height: 240px;
      padding: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label for="scriptSelect">LLM response</label>
    <select id="scriptSelect"></select>
    <button id="resetButton" type="button">Reset</button>
    <button id="runButton" type="button" disabled>Run</button>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <div id="main"></div>

  <script>
    const initialMarkdown = `# My heading

This is **bold with *nested italic***.

This is **another bold with *nested italic* and follow-up non-italic bold**.

This is ++underlined with **bold** inside++.

- First item
- Second **bold** item
- A [link with *italic text*](https://example.com)

\\*This is not italic\\*`;

    const scripts = [
      { label: 'ChatGPT Online', file: 'js/chatgpt-online.js' },
      { label: 'Claude Online', file: 'js/claude-online.js' },
      { label: 'Devstral LMS', file: 'js/devstral-lms.js' },
      { label: 'Mistral Online', file: 'js/mistral-online.js' },
      { label: 'Ornith LMS', file: 'js/ornith-lms.js' },
      { label: 'Ornith MTPLX', file: 'js/ornith-mtplx.js' },
      { label: 'Qwen3 Coder LMS', file: 'js/qwen3-coder-lms.js' },
      { label: 'Qwen3.6 27B MTPLX', file: 'js/qwen3.6-27b-mtplx.js' },
      { label: 'Qwen3.6 Coder LMS', file: 'js/qwen3.6-coder-lms.js' },
      { label: 'Qwen3.8 27B LMS', file: 'js/qwen3.8-27b-lms.js' },
      { label: 'Qwen3.8 9B LMS', file: 'js/qwen3.8-9b-lms.js' },
      { label: 'Qwen3.8 MTPLX', file: 'js/qwen3.8-mtplx.js' },
      { label: 'Qwopus3.6 Coder MTPLX', file: 'js/qwopus3.6-coder-mtplx.js' }
    ];

    const main = document.getElementById('main');
    const scriptSelect = document.getElementById('scriptSelect');
    const resetButton = document.getElementById('resetButton');
    const runButton = document.getElementById('runButton');
    const status = document.getElementById('status');
    let loadedScript = null;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? 'error' : '';
    }

    function resetMain() {
      main.textContent = initialMarkdown;
      delete main.dataset.markdownConverted;
      setStatus('');
    }

    function unloadScript() {
      if (loadedScript) {
        loadedScript.remove();
        loadedScript = null;
      }
      window.run = undefined;
      runButton.disabled = true;
    }

    function loadSelectedScript() {
      const selected = scripts[scriptSelect.selectedIndex];
      unloadScript();
      resetMain();
      setStatus(`Loading ${selected.label}...`);

      const script = document.createElement('script');
      script.src = selected.file;
      script.onload = () => {
        loadedScript = script;
        runButton.disabled = typeof window.run !== 'function';
        setStatus(runButton.disabled ? `${selected.label} did not expose run().` : `${selected.label} loaded.`);
      };
      script.onerror = () => {
        script.remove();
        setStatus(`Could not load ${selected.file}.`, true);
      };
      document.body.appendChild(script);
    }

    function runSelectedScript() {
      if (typeof window.run !== 'function') {
        setStatus('No runnable script is loaded.', true);
        return;
      }

      try {
        window.run();
        setStatus(`${scripts[scriptSelect.selectedIndex].label} ran.`);
      } catch (error) {
        setStatus(error && error.message ? error.message : String(error), true);
        throw error;
      }
    }

    for (const script of scripts) {
      const option = document.createElement('option');
      option.value = script.file;
      option.textContent = script.label;
      scriptSelect.appendChild(option);
    }

    scriptSelect.addEventListener('change', loadSelectedScript);
    resetButton.addEventListener('click', resetMain);
    runButton.addEventListener('click', runSelectedScript);

    resetMain();
    loadSelectedScript();
  </script>
</body>
</html>
